# Compose de produção — VPS + nginx/Caddy com SSL automático.
# Uso:
#   1) Configure DNS apontando seu domínio para o IP do VPS
#   2) Edite Caddyfile com seu domínio
#   3) cp .env.example .env e preencha com senhas reais
#   4) docker compose -f docker-compose.prod.yml up -d
services:
  rhino:
    build: .
    container_name: rhino-app
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_VERSION: ${APP_VERSION:-prod}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rhino-net

  db:
    image: postgres:16-alpine
    container_name: rhino-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rhino-net

  caddy:
    image: caddy:2-alpine
    container_name: rhino-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - rhino
    networks:
      - rhino-net

volumes:
  pg_data:
  caddy_data:
  caddy_config:

networks:
  rhino-net:
    driver: bridge
