name: Build Frontend

on:
  push:
    branches: [main]
    paths:
      - 'web/src/**'
      - 'web/index.html'
      - 'web/vite.config.ts'
      - 'web/tsconfig*.json'
      - 'web/package*.json'
      - 'web/public/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web

      - name: Commit built dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Força add mesmo com web/.gitignore excluindo dist/
          git add -f web/dist/
          if git diff --staged --quiet; then
            echo "Nenhuma mudança no dist — skip commit"
            exit 0
          fi
          git commit -m "build: frontend dist [skip ci]"

          # Retry com rebase quando outro push ganhou a corrida (humano commitando
          # ao mesmo tempo que o CI). Até 5 tentativas com backoff.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push OK na tentativa $attempt"
              exit 0
            fi
            echo "Push rejeitado (tentativa $attempt) — rebasing"
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          echo "Falhou após 5 tentativas"
          exit 1
