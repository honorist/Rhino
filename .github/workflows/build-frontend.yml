name: Build Frontend

on:
  push:
    branches: [main]
    paths:
      - 'web/src/**'
      - 'web/index.html'
      - 'web/vite.config.ts'
      - 'web/tsconfig*.json'
      - 'web/package*.json'
      - 'web/public/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web

      - name: Commit built dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Força add mesmo com web/.gitignore excluindo dist/
          git add -f web/dist/
          if git diff --staged --quiet; then
            echo "Nenhuma mudança no dist — skip commit"
          else
            git commit -m "build: frontend dist [skip ci]"
            git push
          fi
