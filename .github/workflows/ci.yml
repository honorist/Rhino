name: CI (testes unitários)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB:       rhino
          POSTGRES_USER:     rhino
          POSTGRES_PASSWORD: rhino_test_pwd
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL:   postgres://rhino:rhino_test_pwd@localhost:5432/rhino
      ADMIN_EMAIL:    admin@rhino.local
      ADMIN_PASSWORD: admin123
      NODE_ENV:       test
      RHINO_URL:      http://localhost:3001
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Lint (ESLint — falha em erro)
        run: npm run lint

      - name: Apply schema to Postgres
        run: psql "$DATABASE_URL" < db/schema.sql

      - name: Run migrations
        run: npm run db:migrate

      - name: Syntax check (server.js)
        run: node --check server.js

      - name: Start app
        run: |
          node server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fs http://localhost:3001/api/health >/dev/null 2>&1; then
              echo "App ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "App did not start"; cat server.log; exit 1

      - name: Unit tests + piso de cobertura
        # Roda a suíte E exige o piso de cobertura (ratchet — impede regressão).
        # Piso conservador abaixo do atual (~75% linha / 81% branch / 53% func,
        # medido em 2026-09-01 — item 13 do plano async-wandering-kite subiu o
        # piso, que estava conservador demais desde o item 23 do roadmap);
        # suba de novo quando a cobertura crescer. Ver npm run test:coverage.
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-lines=73
          --test-coverage-branches=78
          --test-coverage-functions=50
          test/*.test.js

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ci-server-log
          path: server.log
