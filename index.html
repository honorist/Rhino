<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- FIX SEC-06: scripts extraídos para arquivos externos para permitir CSP
       sem 'unsafe-inline'. Carregar síncronos (sem defer) — precisam rodar
       antes que qualquer outro recurso seja resolvido / antes do primeiro paint. -->
  <script src="./js/boot/base-href.js"></script>
  <title>Rhino — Gestão Empresarial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- jsdelivr só é usado para mermaid (Manual). Outros preconnects removidos
       junto com a vendorização das libs (FIX SEC-06). -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <!-- Fontes consolidadas (display=swap evita FOIT). Pesos reduzidos do conjunto
       300-800 original para os pesos efetivamente usados na UI — economiza 6-9 woff2. -->
  <link rel="preload" as="style" crossorigin
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Inter:wght@400;500;600&family=Inter+Tight:wght@700&display=swap">
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Inter:wght@400;500;600&family=Inter+Tight:wght@700&display=swap">
  <link rel="dns-prefetch" href="https://a.tile.openstreetmap.org">
  <link rel="dns-prefetch" href="https://b.tile.openstreetmap.org">
  <link rel="dns-prefetch" href="https://c.tile.openstreetmap.org">
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/theme-v2.css">
  <link rel="stylesheet" href="./css/polish.css">
  <link rel="stylesheet" href="./css/ui-kit.css">
  <!-- Leaflet CSS é carregado sob demanda por RhinoLazy.ensure('leaflet')
       (que inclui a dep 'leaflet-css'). Não precisa eager aqui. -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#55588B">
  <meta name="application-name" content="Rhino">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rhino">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="./assets/icon.svg">
  <link rel="apple-touch-icon" sizes="192x192" href="./assets/logo.png">
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/logo.png">
  <link rel="mask-icon" href="./assets/favicon.svg" color="#55588B">
  <script src="./js/boot/theme-init.js"></script>
  <style>
    .leaflet-container { background: #E5E7EB; }
    .obra-popup { font-family: inherit; min-width: 200px; }
    .obra-popup h4 { margin: 0 0 4px; font-size:15px; font-weight: 700; color: #1F2937; }
    .obra-popup .pop-sub { font-size:15px; color: #374151; margin-bottom: 6px; }
    .obra-popup .pop-val { font-size: 15px; font-weight: 700; color: #55588B; }
    .nominatim-dropdown { position:absolute;z-index:9999;background:var(--color-surface);border:1px solid var(--color-border);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-height:220px;overflow-y:auto;width:100%; }
    .nominatim-item { padding:10px 14px;cursor:pointer;font-size:15px;border-bottom:1px solid var(--color-border);transition:background .1s; }
    .nominatim-item:last-child { border-bottom:none; }
    .nominatim-item:hover { background:var(--color-bg); }
    .nominatim-item strong { display:block;font-size:15px;margin-bottom:1px; }
    .nominatim-item span { font-size:15px;color:var(--color-text-muted); }
  </style>
</head>
<body>
  <a href="#app" class="skip-link">Pular para o conteúdo</a>
  <div id="shell">
    <nav id="sidebar" aria-label="Menu principal"></nav>
    <main id="app" role="main" tabindex="-1">
      <div class="boot-loader" role="status" aria-live="polite">
        <div class="boot-loader__brand">
          <div class="boot-loader__logo">R</div>
          <div class="boot-loader__name">Rhino</div>
        </div>
        <div class="boot-loader__bar"><span></span></div>
        <div class="boot-loader__hint">Iniciando aplicação…</div>
      </div>
    </main>
  </div>

  <!-- Bibliotecas carregadas sob demanda via js/lazy.js (jsPDF, SignaturePad,
       Mermaid, Chart, Leaflet, geo, recurrence). Apenas icons.js (~3 KB) e
       lazy.js (precisa estar disponível) permanecem eager. -->
  <script src="./js/lib/icons.js" defer></script>
  <script src="./js/lib/ui-kit.js" defer></script>
  <script src="./js/lazy.js" defer></script>
  <script src="./js/exports.js" defer></script>
  <!-- FIX SEC-06: delegação global p/ substituir onclick/onerror inline removidos -->
  <script src="./js/boot/inline-handlers.js" defer></script>

  <!-- Modo local (browser-only) descontinuado: agora rodamos sempre contra o servidor real
       (server.js + Postgres). Para reativar o modo offline com localStorage,
       descomente a linha abaixo — mas note que o apiMock NÃO suporta /api/auth/* nem
       o schema atual do PG. -->
  <!-- <script src="./js/apiMock.js"></script> -->

  <!-- Load in dependency order: store first, views second, app last. defer preserva ordem. -->
  <script src="./js/store.js" defer></script>
  <script src="./js/views/Dashboard.js" defer></script>
  <script src="./js/views/Contratos.js" defer></script>
  <!-- ContratoDetail + sub-módulos contrato/* → lazy via _lazyManifest em app.js -->
  <!-- Comparativo → lazy via _lazyManifest -->
  <script src="./js/views/Clientes.js" defer></script>
  <script src="./js/views/Fornecedores.js" defer></script>
  <script src="./js/views/Caixa.js" defer></script>
  <script src="./js/views/Socios.js" defer></script>
  <script src="./js/views/Investimentos.js" defer></script>
  <script src="./js/views/NotasFiscais.js" defer></script>
  <script src="./js/views/ContasPagar.js" defer></script>
  <!-- Conciliacao, Estoque, SolicitacoesCompra, Frota, CobrancaMensal,
       Usuarios, Portal, Relatorio → lazy via _lazyManifest -->
  <script src="./js/views/Base.js" defer></script>
  <script src="./js/views/Configuracao.js" defer></script>
  <script src="./js/views/RDOs.js" defer></script>
  <!-- Auditoria → lazy via _lazyManifest -->
  <script src="./js/views/Obras.js" defer></script>
  <script src="./js/views/Recursos.js" defer></script>
  <script src="./js/views/Recrutamento.js" defer></script>
  <script src="./js/views/Sugestoes.js" defer></script>
  <script src="./js/views/CronogramaGeral.js" defer></script>
  <script src="./js/views/Documentos.js" defer></script>
  <!-- Manual / Previsao / AiChat → lazy via _lazyManifest -->
  <script src="./js/bm.js" defer></script>
  <script src="./js/push.js" defer></script>
  <script src="./js/app.js" defer></script>
  <script src="./js/notificacoes.js" defer></script>
  <script src="./js/polish.js" defer></script>
  <script src="./js/power.js" defer></script>
  <script src="./js/themer.js" defer></script>
  <script src="./js/realtime.js" defer></script>
  <script src="./js/onboarding.js" defer></script>
  <script src="./js/offline.js" defer></script>
</body>
</html>
