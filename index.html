<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rhino — Gestão Empresarial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <style>
    .leaflet-container { background: #1a2035; }
    .obra-popup { font-family: inherit; min-width: 200px; }
    .obra-popup h4 { margin: 0 0 4px; font-size: 14px; font-weight: 700; }
    .obra-popup .pop-sub { font-size: 12px; color: #666; margin-bottom: 6px; }
    .obra-popup .pop-val { font-size: 15px; font-weight: 700; color: #2E7D52; }
    .nominatim-dropdown { position:absolute;z-index:9999;background:var(--color-surface);border:1px solid var(--color-border);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-height:220px;overflow-y:auto;width:100%; }
    .nominatim-item { padding:10px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--color-border);transition:background .1s; }
    .nominatim-item:last-child { border-bottom:none; }
    .nominatim-item:hover { background:var(--color-bg); }
    .nominatim-item strong { display:block;font-size:13px;margin-bottom:1px; }
    .nominatim-item span { font-size:11px;color:var(--color-text-muted); }
  </style>
</head>
<body>
  <div id="shell">
    <nav id="sidebar"></nav>
    <main id="app">
      <div class="loading-spinner">Iniciando aplicação...</div>
    </main>
  </div>

  <!-- Load libraries first -->
  <script src="/js/lib/chart.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <!-- Load in dependency order: store first, views second, app last -->
  <script src="/js/store.js"></script>
  <script src="/js/views/Dashboard.js"></script>
  <script src="/js/views/Contratos.js"></script>
  <script src="/js/views/ContratoDetail.js"></script>
  <script src="/js/views/Clientes.js"></script>
  <script src="/js/views/Fornecedores.js"></script>
  <script src="/js/views/Caixa.js"></script>
  <script src="/js/views/Socios.js"></script>
  <script src="/js/views/Investimentos.js"></script>
  <script src="/js/views/NotasFiscais.js"></script>
  <script src="/js/views/ContasPagar.js"></script>
  <script src="/js/views/Base.js"></script>
  <script src="/js/views/Configuracao.js"></script>
  <script src="/js/views/Obras.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
