services:
  - type: web
    name: rhino
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: APP_PORT
        value: "3001"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rhino-db
          property: connectionString
    autoDeploy: true

databases:
  - name: rhino-db
    plan: starter
    postgresMajorVersion: "16"
