# Fly.io deploy config — https://fly.io/docs/reference/configuration/
# Pré-requisitos:
#   1) flyctl auth login
#   2) flyctl postgres create --name rhino-db (anote a DATABASE_URL)
#   3) flyctl secrets set DATABASE_URL=...
#   4) flyctl deploy
app = "rhino"
primary_region = "gru"  # São Paulo

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3001"
  NODE_ENV = "production"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
